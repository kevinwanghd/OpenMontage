# P0 primary draft profile (A2 / MOD-03 / §12.10).
#
# Routing decision (owner, 2026-11-14): M1 video generation runs on the Token
# Plan subscription -- wan3.0-video at 720P (¥0.60/s). Free models (happyhorse
# etc.) are NOT used unless the user explicitly requests them.
# Membership gateways (molica, Holopix) are kept registered as optional
# fallbacks only: their ToS/commercial rights are UNVERIFIED (R25), so they must
# never be the primary chain. Delivery is 720P -> 1080x1920 upscale, a DEGRADED
# path (DEL-01, F34) declared below -- not improvised at runtime.
version: "1.0"
profile: tiktok-draft
description: "Token Plan wan3.0-video 720P primary with native lipsync; no free models; 1080P delivery via upscale."
draft: true
cost_routing:
  mode: token_plan
  primary: dashscope_video
  primary_resolution: 720p
  optional_fallbacks: [molica_video, holopix_video]
  optional_fallback_status: "UNVERIFIED membership ToS (R25); requires approval before use"
delivery:
  target_platform: tiktok
  target_resolution: 1080x1920
  draft_resolution: 720p
  requires_upscale: true
  degradation_id: delivery_upscale

bindings:
  video_primary:
    chain:
      # 1. Token Plan wan3.0-video: the sole primary chain (owner decision
      #    2026-11-14). Native lipsync via media[reference_audio]; no free
      #    model rotation. DASHSCOPE_BASE_URL must point to the Token Plan host.
      - tool: dashscope_video
        provider: dashscope
        catalog_model: dashscope/wan3.0-video
        model: wan3.0-video
        tier: paid
        cost_cny_per_run: 3.0
        operations: [text_to_video, image_to_video]
        capabilities:
          output_resolutions: ["480p", "720p", "1080p"]
          lipsync_from_dialogue: true
          reference_audio: true
      # 2. Optional membership fallback -- NOT usable as the primary chain:
      #    membership ToS/commercial rights are UNVERIFIED (R25). Only reachable
      #    when the official primary is unavailable, and only with approval.
      - tool: molica_video
        provider: molica
        catalog_model: molica/wan30video
        tier: free
        session_auth: true
        primary_eligible: false
        role: optional_fallback
        note: "UNVERIFIED membership ToS (R25); optional fallback, not a primary chain"
        operations: [text_to_video, image_to_video, reference_to_video]
      # 3. Optional credit-backed membership -- also NOT usable as primary.
      - tool: holopix_video
        provider: holopix
        catalog_model: holopix/seedance-2-0
        tier: credit
        session_auth: true
        primary_eligible: false
        role: optional_fallback
        note: "UNVERIFIED membership ToS (R25); optional fallback, not a primary chain"
        operations: [text_to_video, image_to_video, first_last_frame_to_video]

  # D20 (short-drama v2.5): music comes ONLY from the local royalty-free
  # library (music_library/, tracks registered in licenses.json). No
  # generation-API or scraped fallback: an empty library makes the slot
  # unusable so the brief-gate preflight stops before any video spend
  # (MUSIC_UNAVAILABLE). Other profiles keep the common.yaml music chain.
  music:
    chain:
      - tool: music_library
        provider: local
        tier: local
        operations: [music]

degradation:
  # Declared first so a concrete unmet resolution outranks the generic
  # chain-degraded plan (both may match at once; equal specificity keeps the
  # first declaration).
  - id: delivery_upscale
    slot: video_primary
    when:
      missing_output_resolutions: ["1080p"]
    lost: [native_1080p]
    path:
      - stage: delivery_upscale
        binding: upscale
    approval_required: false
    declared: true
    note: "720P draft -> 1080x1920 upscale; marked DEGRADED in delivery artifact (DEL-01/F34)."

  - id: video_primary_official_unavailable
    slot: video_primary
    when:
      chain_degraded: true
    lost: [official_primary]
    path:
      - stage: shot_gen
        binding: molica_video
    approval_required: true
    note: "Official Bailian unavailable -> membership gateway only; membership ToS is UNVERIFIED (R25), approval required."

  - id: video_primary_no_native_lipsync
    slot: video_primary
    when:
      missing_capabilities: [lipsync_from_dialogue]
    lost: [native_lipsync]
    path:
      - stage: tts_dialogue
      - stage: lipsync
      - stage: mux
    approval_required: true
    note: "Draft video binding cannot do native dialogue lipsync; add TTS + lipsync + mux sub-stages."