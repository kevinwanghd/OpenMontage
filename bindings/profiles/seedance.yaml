# Seedance-first profile. Definition preserved for M4 switch testing (MOD-09);
# P0 does not verify it end-to-end.
version: "1.0"
profile: seedance
description: "Seedance 2.0 primary: native audio, dialogue lipsync, reference images."
draft: false
delivery:
  target_platform: tiktok
  target_resolution: 1080x1920
  draft_resolution: 1080p
  requires_upscale: false
bindings:
  video_primary:
    chain:
      - tool: seedance_ark
        provider: seedance
        catalog_model: seedance/doubao-seedance-2-0
        tier: paid
        operations: [text_to_video, image_to_video, reference_to_video]
      - tool: kling_official_video
        provider: kling
        catalog_model: kling/kling-2-5
        tier: paid
        operations: [text_to_video, image_to_video]
degradation:
  - id: video_primary_no_native_lipsync
    slot: video_primary
    when:
      missing_capabilities: [lipsync_from_dialogue]
    lost: [native_lipsync]
    path:
      - stage: tts_dialogue
      - stage: lipsync
      - stage: mux
    approval_required: true