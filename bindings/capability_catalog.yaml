# Per-model x per-operation capability catalog (MOD-02, F13/F34).
#
# Source of truth for "what this model can actually do". Absent/unknown is NOT
# support: unknown values are written as the string "unknown" and doctor turns
# them into DEGRADED/BLOCKED instead of guessing.
#
# Owner: the binding layer owner (WP-B). M1 fills verified_at from live tests;
# provider fragments (e.g. bindings/catalog/dashscope.yaml from WP-F) are
# aggregated by lib/capability_slots.load_catalog() and never edit this file.
#
# verification_status:
#   VERIFIED   measured against the provider
#   MOCKED     contract proven against a mock only
#   UNVERIFIED declared from docs/snapshots, not measured
#   BLOCKED    known not to work / rights unclear
version: "1.0"
