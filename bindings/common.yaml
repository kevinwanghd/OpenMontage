# Slot bindings shared by every profile.
#
# Profiles override any slot they bind themselves (video_primary, lipsync for
# the model-specific chains). Keeping the non-video slots here means a new
# model profile does not need to restate the TTS/compose/subtitle plumbing.
#
# P0 rule: these are declarations, not proof. Capability truth comes from
# bindings/capability_catalog.yaml and doctor; an unbound/unverified path is
# reported, never silently upgraded to GREEN.
version: "1.0"
bindings:
  # Image slots follow the same official-first decision as video: the primary is
  # the official Alibaba Bailian image API (dashscope_image / Qwen-Image), whose
  # contract lives in tools/graphics/dashscope_image.py. The legacy fal.ai
  # gateway stays as an explicit fallback. With no DASHSCOPE_API_KEY the tool
  # reports unavailable and doctor stays BLOCKED/DEGRADED -- never GREEN.
  image_character_key:
    chain:
      - tool: dashscope_image
        provider: dashscope
        catalog_model: dashscope/qwen-image-2.0-pro
        tier: paid
        operations: [text_to_image]
      - tool: bria_fal_image
        provider: bria
        catalog_model: bria/fibo-2
        tier: paid
        operations: [image_edit]
        note: "legacy fal.ai gateway fallback (FAL_KEY); image edit path"

  image_reference:
    chain:
      - tool: dashscope_image
        provider: dashscope
        catalog_model: dashscope/qwen-image-2.0-pro
        tier: paid
        operations: [text_to_image]
      - tool: bria_fal_image
        provider: bria
        catalog_model: bria/fibo-2
        tier: paid
        operations: [image_edit]
        note: "legacy fal.ai gateway fallback (FAL_KEY); image edit path"

  tts_voice:
    chain:
      - tool: doubao_tts
        provider: doubao
        tier: paid
        operations: [tts]

  lipsync:
    chain:
      - tool: kling_lip_sync
        provider: kling
        tier: paid
        operations: [lipsync]

  music:
    chain:
      # music_gen is an ElevenLabs API tool; declaring it local made the
      # budget gate under-count a paid call (NFR-01).
      - tool: music_gen
        provider: elevenlabs
        tier: paid
        operations: [music]

  compose:
    chain:
      - tool: video_compose
        provider: local
        tier: local
        operations: [compose]

  subtitle:
    chain:
      - tool: subtitle_gen
        provider: local
        tier: local
        operations: [subtitle]

  text_llm:
    chain:
      # Free quota on the DashScope endpoint is the primary: marginal cost is
      # zero and "stop when exhausted" rules out paid spill-over. No fallback
      # is declared on purpose -- a missing key or exhausted quota must surface
      # as BLOCKED/UNAVAILABLE, not silently reroute to a paid text model.
      - tool: bailian_chat
        provider: bailian
        tier: free
        operations: [translate, classify, summarize, extract, vision, draft]

  upscale:
    chain:
      - tool: upscale
        provider: local
        tier: local
        operations: [upscale]