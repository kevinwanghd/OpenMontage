name: CI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 合并门禁以「workflow 整体结论」判定（governance.config.yml 的 ci_workflows），
# 不是按单个 job 登记：Lint 失败会让整个 workflow 失败，从而阻止 AUTO_MERGE，
# 不依赖 branch protection 的必需检查列表。
jobs:
  lint:
    name: Lint
    # 固定镜像：预装工具（如 ffmpeg）随镜像更新漂移，锁版本才能复现
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # 不用 setup-python 的 pip 缓存：依赖改由 uv 安装，pip 缓存目录不存在
          # 会让 post 步骤报错；uv 自带缓存

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: make install-dev

      # lint 只做 py_compile，不需要 ffmpeg；与测试并行，缩短门禁等待
      - name: Run lint smoke checks
        run: make lint

  validate:
    # 按目录分片，各分片跑在独立 runner 上（片内串行），墙钟≈最慢分片。
    # 分片只决定"跑哪些用例"：仓库仍整份检出，跨目录 import 照常可用；
    # 各分片的用例集合互不依赖对方"先跑过"（tests/qa 与 backlot 归同一片）。
    name: Validate Python (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [tools, contracts, pipeline]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # 不用 setup-python 的 pip 缓存：依赖改由 uv 安装，pip 缓存目录不存在
          # 会让 post 步骤报错；uv 自带缓存

      - name: Install ffmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: make install-dev

      - name: Run test suite
        run: make test-shard-${{ matrix.shard }}