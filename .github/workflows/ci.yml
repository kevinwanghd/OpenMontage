name: CI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 合并门禁以「workflow 整体结论」判定（governance.config.yml 的 ci_workflows），
# 不是按单个 job 登记：Lint 失败会让整个 workflow 失败，从而阻止 AUTO_MERGE，
# 不依赖 branch protection 的必需检查列表。
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: make install-dev

      # lint 只做 py_compile，不需要 ffmpeg；与测试并行，缩短门禁等待
      - name: Run lint smoke checks
        run: make lint

  validate:
    # 按目录分片到独立 runner：墙钟≈最慢分片，且各分片不共享进程状态
    name: Validate Python (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [tools, contracts, pipeline]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # ubuntu-latest 镜像自带 ffmpeg；只在缺失时安装，省掉每次 20-60s 的 apt
      - name: Ensure ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Install dependencies
        run: make install-dev

      - name: Run test suite
        run: make test-ci GROUP=${{ matrix.group }}