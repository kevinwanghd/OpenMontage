# MR 治理规范配置 v1
version: v1.3.0

metadata:
  enforcement: hard           # 缺字段直接阻断；治理检查默认禁止违规
  soft_deadline: 2027-02-09   # 仅供显式 soft 过渡配置使用
  mandatory_fields:
    - background          # ## 背景
    - changes             # ## 变更内容
    - ai_usage            # AI-Usage 字段
    - self_test           # ## 自测确认

risk_annotations:
  enforcement: hard           # 风险注解不合规直接阻断
  reviewed_max_age_days: 90   # 3 个月 (推荐: 与季度 review 节奏对齐)
  # 路径豁免: 生成/引入/第三方代码不扫 (开发者不为这些代码负责)
  scan_exclude_paths:
    - "**/governance/scripts/**"   # 扫描器自身不扫自己(含风险模式字面示例)
    - "governance/scripts/**"
    - "**/vendor/**"
    - "**/node_modules/**"
    - "**/third_party/**"
    - "**/*_pb2.py"
    - "**/*_pb2_grpc.py"
    - "**/*.pb.go"
    - "**/*.generated.*"
    - "**/gen/**"
    - "**/dist/**"
    - "**/build/**"
    - "**/migrations/**"
    - "**/*.min.js"
    - "**/*.min.css"
  registered_types:
    - auth-bypass
    - magic-id
    - swallowed-exception
    - suppressed-warning
    - skipped-test
    - time-bypass
    - env-hardcode
    - todo-no-context
    - test-removal
    - untested
  reason_blacklist:
    - 临时
    - 先这样
    - 历史原因
    - TODO
    - 待确认
    - quick fix
    - temp
    - wip
    - hack
    - for now

large_change:
  line_threshold: 500
  excluded_paths:
    - "*.lock"
    - "*.Designer.cs"
    - "migrations/**"
    - "**/*.generated.*"
  sensitive_paths:
    - "ci/"
    - "CODEOWNERS"
    - "charts*/"
    - "*secret*"
    - ".gitlab-ci.yml"
  schema_paths:
    - "*.sql"
    - "migrations/**"
    - "*.proto"

# GitHub thin 模式由 GitHub Actions 默认 runner 执行, 不使用 GitLab CI 镜像变量。

auto_merge:
  enabled: true
  strategy: squash
  delete_branch_after_merge: true
  require_up_to_date_branch: true
  require_all_required_checks: true
  # 仓库自己的 CI；gate 等它在该 PR 提交上跑完，失败或超时都会阻止自动合并
  ci_workflows:
    - ci.yml
  # AI 审查：glm-5.3 按目标分支的审查要点审分支 diff，有 findings 阻止自动合并
  ai_review:
    model: glm-5.3
    points: ops/review-points.md
    internal:
      - "**/*.md"
  required_checks_by_risk:
    low:
      - risk-scan
      - secret-scan
      - mr-validate
      - ci
      - review
    medium:
      - risk-scan
      - secret-scan
      - mr-validate
      - test-check
      - ci
      - review

    high:
      - risk-scan
      - secret-scan
      - mr-validate
      - test-check
      - ci
      - review

    critical:
      - risk-scan
      - secret-scan
      - mr-validate
      - test-check
      - ci
      - review

  required_checks:
    - risk-scan
    - secret-scan
    - mr-validate
    - test-check
    - ci
    - review
  protected_paths:
    - AGENTS.md
    - CLAUDE.md
    # 对 Agent 有约束力的规则文档：改动需人工审批，且不在免审范围
    - AGENT_GUIDE.md
    - docs/decisions.md
    - docs/declined.md
    - .hermes.md
    - .github/copilot-instructions.md
    - .cursor/rules/**
    - governance.config.yml
    - .github/workflows/**
    - .gitlab-ci.yml
    - ci/**
    - governance/**
    - CODEOWNERS
    - scripts/scan_risks.py
    - scripts/check_tested.py
    - scripts/validate_mr.py
    - scripts/gate_decision.py
  risk_paths:
    low:
      - docs/**
      - "*.md"
    high:
      - "**/auth/**"
      - "**/payment/**"
      - "**/deploy/**"
      - .github/workflows/**
      - .gitlab-ci.yml
      - ci/**
    critical:
      - governance.config.yml
      - governance/**

testing:
  enforcement: hard           # 生产代码缺少测试证据直接阻断
  soft_deadline: 2027-02-09   # 仅供显式 soft 过渡配置使用
  accept_tested_trailer: true  # thin 模式无本地 evidence bundle；CI 独立跑 make test 真正验证测试，Tested: trailer 仅记录结果并与 CI 互证，故接受
  untested_max_age_days: 90   # risk:untested 注解有效期 (推荐: 与季度 review 节奏对齐)
  exclude_paths:              # 整目录/模式免测试检查 (DTO/迁移/生成代码/启动引导)
    - "governance/scripts/**"  # AgentGate vendored tooling is tested upstream
    - "**/Migrations/**"
    - "**/*.Designer.cs"
    - "**/*.generated.*"
    - "**/Program.cs"
    - "**/Startup.cs"
    - "**/*Dto.cs"
    - "**/*Dtos.cs"
    - "**/*.proto"
    - "*.sql"
  reason_blacklist:
    - 临时
    - 先这样
    - 历史原因
    - TODO
    - 待确认
    - quick fix
    - temp
    - wip
    - hack
    - for now

deliverhq_integration:
  enabled: false
  records_dirs:
    - "docs/requirements/"
    - "DeliverHQ/change-requests/"
  evidence_summary: "DeliverHQ/evidence-summary.json"
  # 从需求文档自动读取"背景"，AI 无需手传 --why
  requirement_doc_patterns:
    - "requirement.md"
    - "spec.md"
    - "README.md"
    - "index.md"
  background_headings:
    - "背景"
    - "Background"
    - "需求描述"
    - "目标"

# GitHub thin 模式使用 gh pr create 创建 PR, 不需要 GitLab create_mr 配置。
